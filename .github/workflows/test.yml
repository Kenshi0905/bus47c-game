name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  story-and-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and test
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path game --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/import.log
          "$GODOT" --headless --path game --script res://tests/test_story.gd 2>&1 | tee /tmp/story.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/story.log
          "$GODOT" --headless --path game -- --smoke 2>&1 | tee /tmp/scene.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Assertion failed' /tmp/scene.log
